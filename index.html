<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>IDX TERMINAL PRO V3.3</title></head><body>
<header><div><h1>IDX TERMINAL <b>PRO V3.3</b></h1><small id="status">Memuat data...</small></div><button id="refresh">↻ Refresh</button></header>
<section class="market"><div class="ihsg-box"><span>IHSG</span><strong id="ihsg">-</strong><small id="ihsgChange">Memuat...</small></div><div>EMITEN <strong id="count">0</strong><small id="activeCount">Active</small></div><div>DATA <strong id="schema">CHECK</strong><small id="updatedAt">-</small></div></section>
<section class="controls"><div class="search-wrap"><input id="search" placeholder="Cari ticker / sektor..."><button id="clearSearch" title="Hapus pencarian" aria-label="Hapus pencarian">×</button></div><select id="signal"><option value="">Semua Signal</option><option>ELITE BUY</option><option>STRONG BUY</option><option>BUY</option><option>WATCHLIST</option><option>WAIT</option><option>AVOID</option></select></section>
<nav><button data-view="all" class="active">Market</button><button data-view="signals">Signals</button><button data-view="favorites">★ Favorit</button><button data-view="emiten">📋 Emiten</button></nav>
<main id="app"><div class="loading">Menyiapkan IDX Terminal PRO...</div></main>
<template id="card"><article class="card"><button class="fav">☆</button><div class="top"><h2></h2><span class="badge"></span></div><p class="sector"></p><div class="price"></div><div class="score"></div><section class="signal-box"><div class="signal-head"><span>ENTRY SIGNAL</span><strong class="signal-percent">0%</strong></div><div class="signal-track"><div class="signal-fill wait"></div></div><div class="signal-status wait">⚪ WAIT</div></section><div class="meta"></div><div class="plan"></div><button class="detail-btn">📊 Rangkuman Analisa</button></article></template>
<dialog id="analysisModal"><article><button id="closeModal" class="close-modal">×</button><div id="analysisContent"></div></article></dialog>
<script src="app.js"></script></body></html>
